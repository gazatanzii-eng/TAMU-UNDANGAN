
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Tes GitHub</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 15px;
            width: 80%;
            max-width: 400px;
        }

        h1 {
            color: #00ffae;
        }

        button {
            background: #00ffae;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #00d995;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Website Berhasil!</h1>
        <p>Selamat! Website HTML kamu berhasil dijalankan.</p>
        <p id="pesan">GitHub & Vercel Test</p>

        <button onclick="ubahPesan()">
            Klik Saya
        </button>
    </div>

    <script>
        function ubahPesan() {
            document.getElementById("pesan").innerHTML =
                "JavaScript Berhasil Berjalan!";
        }
    </script>

</body>
</html>
